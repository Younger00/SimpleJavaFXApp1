plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.openjfx:javafx-controls:21'
}

javafx {
    version = '21'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.example.CustomerManagerApp'
}